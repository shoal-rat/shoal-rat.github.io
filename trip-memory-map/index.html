<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4efe6">
  <meta name="description" content="旅行照片轨迹：把一次旅行的照片放进浏览器，读取 GPS 与拍摄时间，自动连成路线、推断交通方式，并按时间回放整段旅程。照片不会上传。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Trip Memory Map · 旅行照片轨迹">
  <meta property="og:description" content="Drop your trip photos: GPS and capture times become a route, transport is inferred, and the whole trip replays on a map. Nothing is uploaded.">
  <meta property="og:url" content="https://weikezhang.cn/trip-memory-map/">
  <meta property="og:image" content="https://weikezhang.cn/trip-memory-map/og.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://weikezhang.cn/trip-memory-map/">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="/css/site-terminal.css">
  <script defer src="/js/lab.js"></script>
  <script type="module" src="src/main.js"></script>
  <title>旅行照片轨迹 — Trip Memory Map</title>
</head>
<body data-site-terminal-standalone="map">
<div class="app" id="app" data-state="empty" data-theme="paper" data-sheet="peek">

  <div class="map" id="map" aria-label="Map"></div>
  <p class="map-error" id="map-error" hidden>底图暂时无法加载 · Base map unavailable</p>

  <figure class="postcard" id="postcard" hidden>
    <img alt="">
    <figcaption><strong class="pc-name"></strong><span class="pc-time"></span><span class="pc-count"></span></figcaption>
  </figure>

  <aside class="panel" aria-label="Trip">
    <button class="sheet-handle" id="sheet-handle" type="button" data-action="sheet" aria-label="Expand"><span></span></button>
    <header class="panel-top">
      <a class="app-mark" href="/trip-memory-map/">
        <img src="icon.svg" alt="" width="34" height="34">
        <span><strong data-i18n="appName">旅行照片轨迹</strong><small data-i18n="appSub">Trip Memory Map</small></span>
      </a>
      <div class="top-actions">
        <button class="btn small ghost add-btn" type="button" data-action="add-photos">
          <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M10 4v12M4 10h12"/></svg>
          <span data-i18n="addPhotos">添加照片</span>
        </button>
        <button class="icon-btn" type="button" data-action="menu" data-i18n-title="menu">
          <svg viewBox="0 0 20 20" width="19" height="19" aria-hidden="true" fill="currentColor"><circle cx="4.5" cy="10" r="1.5"/><circle cx="10" cy="10" r="1.5"/><circle cx="15.5" cy="10" r="1.5"/></svg>
        </button>
      </div>
      <div class="menu" id="menu" hidden role="menu">
        <button type="button" data-action="poster" data-needs-trip data-i18n="poster">生成分享海报</button>
        <button type="button" data-action="export-gpx" data-needs-trip data-i18n="exportGpx">导出 GPX 轨迹</button>
        <button type="button" data-action="export-archive" data-needs-trip data-i18n="exportArchive">保存旅行存档</button>
        <button type="button" data-action="open-archive" data-i18n="importArchive">打开旅行存档</button>
        <hr>
        <button type="button" data-action="add-folder" data-i18n="chooseFolder">选择文件夹</button>
        <button type="button" data-action="demo" data-i18n="tryDemo">看看示例行程</button>
        <button type="button" data-action="new-trip" data-needs-trip data-i18n="newTrip">新建旅行</button>
        <hr>
        <button type="button" data-action="settings" data-i18n="settings">设置</button>
        <a href="/" role="menuitem" data-i18n="backHome">返回主页</a>
      </div>
    </header>

    <div class="panel-scroll">
      <section class="empty" aria-labelledby="empty-title">
        <h1 id="empty-title" data-i18n="emptyTitle">把旅行照片放在地图上</h1>
        <p class="lede" data-i18n="emptyLede"></p>
        <div class="dropzone">
          <svg viewBox="0 0 48 48" width="42" height="42" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="10" width="36" height="28" rx="4"/><circle cx="17" cy="20" r="3.5"/><path d="M6 32l10-8 8 6 7-5 11 9"/></svg>
          <p data-i18n="dropHint">拖到这里，或</p>
          <div class="dz-actions">
            <button class="btn primary" type="button" data-action="add-photos" data-i18n="choosePhotos">选择照片</button>
            <button class="btn ghost" type="button" data-action="add-folder" data-i18n="chooseFolder">选择文件夹</button>
          </div>
          <small data-i18n="formats"></small>
        </div>
        <button class="demo-btn" type="button" data-action="demo">
          <span class="demo-thumbs" aria-hidden="true"><img src="demo/photos/asakusa-kaminarimon.jpg" alt=""><img src="demo/photos/fushimi-inari-torii.jpg" alt=""><img src="demo/photos/arashiyama-bamboo.jpg" alt=""></span>
          <span><strong data-i18n="tryDemo">看看示例行程</strong><small>东京 → 京都 → 大阪 → 上海 · 3 days · 16 photos</small></span>
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4l6 6-6 6"/></svg>
        </button>
        <ol class="steps">
          <li><b>1</b><span data-i18n="step1"></span></li>
          <li><b>2</b><span data-i18n="step2"></span></li>
          <li><b>3</b><span data-i18n="step3"></span></li>
        </ol>
        <div class="privacy">
          <strong data-i18n="privacyTitle"></strong>
          <p data-i18n="privacyBody"></p>
        </div>
      </section>
      <section class="trip" id="trip"></section>
    </div>

    <div class="importing" id="importing" hidden>
      <div class="imp-row"><span id="importing-label"></span><span id="importing-count"></span></div>
      <div class="imp-bar"><span id="importing-bar"></span></div>
    </div>
    <div class="report" id="report" hidden>
      <div class="rep-row">
        <strong id="report-ok"></strong>
        <span id="report-skip"></span>
        <button class="link" type="button" id="report-skip-toggle" data-action="report-toggle" data-i18n="viewDetails">查看明细</button>
        <button class="icon-btn tiny" type="button" data-action="report-close" data-i18n-title="close"><svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l10 10M15 5L5 15"/></svg></button>
      </div>
      <p class="rep-empty" id="report-empty" hidden></p>
      <ul class="rep-list" id="report-list" hidden></ul>
    </div>
    <p class="status" id="status" hidden></p>
  </aside>

  <div class="map-controls">
    <button class="mc" type="button" data-action="theme" data-i18n-title="mapStyle">
      <svg class="i-sun" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="10" cy="10" r="3.5"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.3 4.3l1.4 1.4M14.3 14.3l1.4 1.4M4.3 15.7l1.4-1.4M14.3 5.7l1.4-1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M16 12.5A6.5 6.5 0 017.5 4a6.5 6.5 0 108.5 8.5z"/></svg>
    </button>
    <button class="mc" type="button" data-action="fit" data-i18n-title="fitAll">
      <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4"/></svg>
    </button>
    <span class="mc-group">
      <button class="mc" type="button" data-action="zoom-in" aria-label="Zoom in"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 4v12M4 10h12"/></svg></button>
      <button class="mc" type="button" data-action="zoom-out" aria-label="Zoom out"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 10h12"/></svg></button>
    </span>
  </div>

  <div class="playbar" id="playbar" hidden>
    <button class="pb-play" id="pb-play" type="button" data-action="play" aria-label="Play"></button>
    <div class="pb-main">
      <div class="pb-top"><span class="pb-clock" id="pb-clock"></span><span class="pb-hint" data-i18n="keyboard"></span></div>
      <div class="pb-track">
        <input type="range" id="pb-range" min="0" max="1000" value="0" aria-label="Replay position">
        <div class="pb-marks" id="pb-marks" aria-hidden="true"></div>
      </div>
    </div>
    <div class="pb-speed" id="pb-speed" role="radiogroup" data-i18n-title="speed">
      <button type="button" data-speed="1" class="is-on">1×</button>
      <button type="button" data-speed="2">2×</button>
      <button type="button" data-speed="4">4×</button>
    </div>
    <button class="icon-btn pb-stop" id="pb-stop" type="button" data-action="stop-replay" data-i18n-title="close" hidden><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l10 10M15 5L5 15"/></svg></button>
  </div>

  <div class="drop" id="drop" hidden><div class="drop-card" data-i18n="dropToAdd">松开以添加照片</div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="viewer" id="viewer" hidden role="dialog" aria-modal="true">
    <div class="vw-stage"><img class="vw-img" alt=""></div>
    <button class="vw-btn vw-prev" type="button" aria-label="Previous"><svg viewBox="0 0 20 20" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4l-6 6 6 6"/></svg></button>
    <button class="vw-btn vw-next" type="button" aria-label="Next"><svg viewBox="0 0 20 20" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 4l6 6-6 6"/></svg></button>
    <button class="vw-btn vw-close" type="button" aria-label="Close"><svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l10 10M15 5L5 15"/></svg></button>
    <div class="vw-caption">
      <div><strong class="vw-place"></strong><span class="vw-meta"></span><span class="vw-file"></span></div>
      <div class="vw-side"><span class="vw-count"></span><button class="btn small ghost vw-map" type="button" data-i18n="showOnMap">在地图上看</button></div>
    </div>
  </div>

  <dialog class="dlg" id="settings" aria-labelledby="settings-title">
    <div class="dlg-head"><h2 id="settings-title" data-i18n="settingsTitle">设置</h2><button class="icon-btn" type="button" data-action="close-dialog" data-i18n-title="close"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 5l10 10M15 5L5 15"/></svg></button></div>
    <div class="dlg-body">
      <fieldset>
        <legend data-i18n="routeMode">路线</legend>
        <label class="choice"><input type="radio" name="route-mode" value="private"><span><strong data-i18n="routePrivate"></strong><small data-i18n="routePrivateHint"></small></span></label>
        <label class="choice"><input type="radio" name="route-mode" value="network"><span><strong data-i18n="routeNetwork"></strong><small data-i18n="routeNetworkHint"></small></span></label>
      </fieldset>
      <fieldset>
        <legend data-i18n="placeNames">地名</legend>
        <label class="choice"><input type="checkbox" id="set-geocode"><span><strong data-i18n="placeNamesOn"></strong><small data-i18n="placeNamesHint"></small></span></label>
      </fieldset>
      <fieldset>
        <legend data-i18n="mergeRadius">合并半径</legend>
        <div class="range-row"><input type="range" id="set-radius" min="50" max="1000" step="25"><output id="set-radius-out"></output></div>
        <small class="hint" data-i18n="mergeRadiusHint"></small>
      </fieldset>
      <fieldset class="inline">
        <legend data-i18n="mapStyle">地图样式</legend>
        <label class="pill"><input type="radio" name="theme" value="paper"><span data-i18n="mapPaper">纸</span></label>
        <label class="pill"><input type="radio" name="theme" value="ink"><span data-i18n="mapInk">夜</span></label>
      </fieldset>
      <fieldset class="inline">
        <legend data-i18n="language">语言</legend>
        <label class="pill"><input type="radio" name="lang" value="zh"><span>中文</span></label>
        <label class="pill"><input type="radio" name="lang" value="en"><span>English</span></label>
      </fieldset>
      <fieldset>
        <legend data-i18n="storage">本地存储</legend>
        <small class="hint" data-i18n="storageHint"></small>
        <button class="btn small ghost danger" type="button" id="clear-data" data-i18n="clearData">清空本地数据</button>
      </fieldset>
      <p class="about"><strong data-i18n="about">关于</strong> <span data-i18n="aboutBody"></span></p>
    </div>
  </dialog>

  <dialog class="dlg poster-dlg" id="poster" aria-labelledby="poster-title">
    <div class="dlg-head"><h2 id="poster-title" data-i18n="posterTitle">分享海报</h2><button class="icon-btn" type="button" data-action="close-dialog" data-i18n-title="close"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 5l10 10M15 5L5 15"/></svg></button></div>
    <div class="poster-media" id="poster-media"></div>
    <div class="dlg-actions"><button class="btn primary" type="button" id="poster-download" data-i18n="download">下载</button></div>
  </dialog>

  <input type="file" id="file-photos" accept="image/*,.heic,.heif" multiple hidden>
  <input type="file" id="file-folder" webkitdirectory multiple hidden>
  <input type="file" id="file-archive" accept=".json,application/json" hidden>
</div>
<noscript><p style="padding:2rem;text-align:center">旅行照片轨迹需要 JavaScript。Trip Memory Map needs JavaScript.</p></noscript>
</body>
</html>
