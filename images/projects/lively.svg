<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Lively project glyph</title>
  <desc id="desc">Live Photo editor themed SVG panel for the Shoal/Rat site.</desc>
  <rect width="640" height="360" rx="28" fill="#050608"/>
  <rect x="20" y="20" width="600" height="320" rx="22" fill="#120c0d" stroke="#3a2528" stroke-width="4"/>
  <rect x="20" y="20" width="600" height="44" rx="22" fill="#101018" stroke="#3a2528" stroke-width="4"/>
  <circle cx="48" cy="42" r="7" fill="#ff5c57"/><circle cx="72" cy="42" r="7" fill="#ffd866"/><circle cx="96" cy="42" r="7" fill="#2ecc9b"/>
  <text x="120" y="48" font-family="SFMono-Regular, Menlo, monospace" font-size="17" fill="#8f8a96">lively — livephoto studio</text>

  <!-- phone frame -->
  <rect x="66" y="88" width="160" height="228" rx="20" fill="#1a1d24" stroke="#3a2528" stroke-width="3"/>
  <!-- mini sunset scene -->
  <g>
    <rect x="80" y="102" width="132" height="30" fill="#ffe3b8"/>
    <rect x="80" y="132" width="132" height="30" fill="#ffd59e"/>
    <rect x="80" y="162" width="132" height="26" fill="#ffc489"/>
    <circle cx="172" cy="140" r="17" fill="#ffb84c"/>
    <polygon points="88,188 132,128 176,188" fill="#3d7dff"/>
    <polygon points="76,188 108,150 142,188" fill="#2ecc9b"/>
    <polygon points="146,188 182,146 216,188" fill="#27b98c"/>
    <rect x="80" y="188" width="132" height="22" fill="#173056"/>
  </g>
  <!-- filter chips row -->
  <g>
    <rect x="80" y="222" width="28" height="28" rx="7" fill="#ff6b6b"/>
    <rect x="114" y="222" width="28" height="28" rx="7" fill="#4a3540"/>
    <rect x="148" y="222" width="28" height="28" rx="7" fill="#4a3540"/>
    <rect x="182" y="222" width="28" height="28" rx="7" fill="#4a3540"/>
  </g>
  <!-- waveform -->
  <g fill="#3d7dff">
    <rect x="82" y="272" width="5" height="10" rx="2.5"/><rect x="91" y="266" width="5" height="22" rx="2.5"/>
    <rect x="100" y="260" width="5" height="34" rx="2.5"/><rect x="109" y="268" width="5" height="18" rx="2.5"/>
    <rect x="118" y="263" width="5" height="28" rx="2.5"/><rect x="127" y="270" width="5" height="14" rx="2.5"/>
    <rect x="136" y="258" width="5" height="38" rx="2.5"/><rect x="145" y="266" width="5" height="22" rx="2.5"/>
    <rect x="154" y="262" width="5" height="30" rx="2.5"/><rect x="163" y="269" width="5" height="16" rx="2.5"/>
    <rect x="172" y="264" width="5" height="26" rx="2.5"/><rect x="181" y="271" width="5" height="12" rx="2.5"/>
    <rect x="190" y="267" width="5" height="20" rx="2.5"/><rect x="199" y="272" width="5" height="10" rx="2.5"/>
  </g>

  <!-- live-photo ring motif -->
  <g transform="translate(432 176)">
    <circle r="94" fill="#ff6b6b"/>
    <circle r="64" fill="none" stroke="#fff" stroke-width="10" stroke-dasharray="20 15" stroke-linecap="round"/>
    <circle r="36" fill="none" stroke="#fff" stroke-width="10"/>
    <circle r="15" fill="#fff"/>
  </g>
  <text x="432" y="311" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace" font-size="16" fill="#c9a3a8">press &amp; hold to relive</text>

  <!-- LIVE pill -->
  <rect x="286" y="96" width="74" height="30" rx="15" fill="#ffb84c"/>
  <circle cx="304" cy="111" r="8" fill="none" stroke="#3a2a08" stroke-width="2.4" stroke-dasharray="3.5 2.6"/>
  <text x="316" y="117" font-family="SFMono-Regular, Menlo, monospace" font-size="15" fill="#3a2a08">LIVE</text>
</svg>
